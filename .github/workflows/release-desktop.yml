name: Compilar .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Crear config.js desde los secretos
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Falta el secreto SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "Falta el secreto SUPABASE_KEY"; exit 1; }
          printf 'window.CONFIG = { SUPABASE_URL: "%s", SUPABASE_ANON_KEY: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_KEY" > config.js

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: inventario-windows
          path: dist/*.exe

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
